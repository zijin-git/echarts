<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>贪吃蛇 · Greedy Snake</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <header class="header">
      <h1>贪吃蛇</h1>
      <p class="subtitle">Greedy Snake</p>
    </header>

    <section class="hud" aria-live="polite">
      <div class="stat">
        <span class="label">得分</span>
        <span id="score" class="value">0</span>
      </div>
      <div class="stat">
        <span class="label">最高分</span>
        <span id="best" class="value">0</span>
      </div>
      <div class="stat">
        <span class="label">状态</span>
        <span id="status" class="value">就绪</span>
      </div>
    </section>

    <main class="stage">
      <canvas id="board" width="400" height="400" aria-label="贪吃蛇游戏画布"></canvas>
      <div id="overlay" class="overlay">
        <p id="overlay-text">按空格或点击开始</p>
      </div>
    </main>

    <section class="controls">
      <button type="button" id="btn-toggle">开始</button>
      <button type="button" id="btn-restart" class="secondary">重新开始</button>
    </section>

    <section class="help">
      <p>方向键或 W/A/S/D 转向 · 空格 开始/暂停 · R 重新开始</p>
    </section>
  </div>
  <script src="game.js"></script>
</body>
</html>
